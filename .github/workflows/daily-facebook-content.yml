name: Daily independent Facebook content

on:
  schedule:
    # 17:00 Asia/Karachi (UTC+5) = 12:00 UTC
    - cron: "0 12 * * *"
  workflow_dispatch: {}

concurrency:
  group: daily-independent-facebook-content
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install image renderer
        run: |
          sudo apt-get update
          sudo apt-get install --yes imagemagick

      - name: Generate and publish independent Facebook content
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION }}
        run: npm run facebook-content
